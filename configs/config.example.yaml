db_path: "./sqlite3.db"
chat_db_path: "./bot_chats.db"
cache_dir: "./cache/rasp"

logging:
  level: "debug"
  format: "pretty"
  file:
    enabled: false
    path: "./logs/app.log"
    max_size_mb: 10
    max_files: 5

http:
  port: 8081

telegram:
  token: ""
  admin_ids: [804594266]
  noticer: true

api:
  url: "/api"

google:
  redirect_domain: "https://mgke.keller.by"
  url: "/google/oauth"
  oauth:
    client_id: ""
    client_secret: ""
  service_account:
    client_email: "calendar@mgkct-timetable.iam.gserviceaccount.com"
    private_key: ""

calendar:
  ics:
    enabled: false

accept:
  room: false
  private: true

parser:
  enabled: true
  proxy: ""
  activity: [9, 17]
  endpoints:
    timetable_group: "https://mgkct.minskedu.gov.by/personnel/for-students/weekly-timetable"
    timetable_teacher: "https://mgkct.minskedu.gov.by/personnel/for-teachers/weekly-timetable"
    team:
      - "https://mgkct.minskedu.gov.by/about/collective/administration"
      - "https://mgkct.minskedu.gov.by/about/collective/teachers"
      - "https://mgkct.minskedu.gov.by/about/collective/employees"
      - "https://mgkct.minskedu.gov.by/about/collective/maintenance"
    bell_schedule: "https://mgkct.minskedu.gov.by/personnel/for-teachers/bell-schedule"
  update_interval:
    default: 3600
    activity: 30
    error: 60
    teams: 86400
    calls: 3600
  alertable_ignore_filter:
    group:
      - lesson: "Уч прак програм"
        type: "Пр-ка"
    teacher: []
  lesson_index_if_empty: 2
  calls:
    enabled: true
    prefer_site: true
    notify: true
    campus: ""

timetable:
  weekdays:
    - [["09:00", "09:45"], ["09:55", "10:40"]]
    - [["10:50", "11:35"], ["11:55", "12:40"]]
    - [["13:00", "13:45"], ["13:55", "14:40"]]
    - [["14:50", "15:35"], ["15:45", "16:30"]]
    - [["16:40", "17:25"], ["17:35", "18:20"]]
    - [["18:30", "19:15"], ["19:25", "20:10"]]
  saturday:
    - [["09:00", "09:45"], ["09:55", "10:40"]]
    - [["10:50", "11:35"], ["11:55", "12:40"]]
    - [["12:50", "13:35"], ["13:45", "14:30"]]
    - [["14:40", "15:25"], ["15:35", "16:20"]]
    - [["16:30", "17:15"], ["17:25", "18:10"]]
    - [["18:20", "19:05"], ["19:15", "20:00"]]

encrypt_key: ""

health:
  disabled: false
  check_minutes: 1
  cooldown_minutes: 30
  parser_stale_minutes: 15
  parser_failures: 3
  parser_layout_failures: 2
  calendar_stale_minutes: 360
  calendar_failures: 3
  api_errors: 20
  api_window_minutes: 5

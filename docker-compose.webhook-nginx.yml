services:
  bot:
    build: .
    image: mgke-timetable-bot:latest
    container_name: mgke-timetable-bot
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      TZ: "${TZ:-Europe/Minsk}"
      MGKE_DB_PATH: /data/sqlite3.db
      MGKE_CHAT_DB_PATH: /data/bot_chats.db
      MGKE_CACHE_DIR: /data/cache/rasp
      MGKE_LOGGING_LEVEL: "${MGKE_LOGGING_LEVEL:-info}"
      MGKE_HTTP_PORT: "8081"
      MGKE_PARSER_ENABLED: "${MGKE_PARSER_ENABLED:-true}"
      MGKE_PARSER_PROXY: "${MGKE_PARSER_PROXY:-}"
      MGKE_CALENDAR_ICS_ENABLED: "${MGKE_CALENDAR_ICS_ENABLED:-false}"
      MGKE_TELEGRAM_TOKEN: "${MGKE_TELEGRAM_TOKEN:?set MGKE_TELEGRAM_TOKEN in .env or the environment}"
      MGKE_TELEGRAM_ADMIN_IDS: "${MGKE_TELEGRAM_ADMIN_IDS:-}"
      # Telegram pushes updates to nginx, which forwards them to the bot.
      MGKE_TELEGRAM_WEBHOOK_ENABLED: "true"
      MGKE_TELEGRAM_WEBHOOK_URL: "https://${BOT_DOMAIN:?set BOT_DOMAIN to the public domain of this host}"
      MGKE_TELEGRAM_WEBHOOK_LISTEN: "0.0.0.0:8082"
      MGKE_TELEGRAM_WEBHOOK_SECRET_TOKEN: "${MGKE_TELEGRAM_WEBHOOK_SECRET_TOKEN:?set MGKE_TELEGRAM_WEBHOOK_SECRET_TOKEN (A-Z a-z 0-9 _ -)}"
      MGKE_TELEGRAM_WEBHOOK_MAX_CONNECTIONS: "${MGKE_TELEGRAM_WEBHOOK_MAX_CONNECTIONS:-40}"
      MGKE_TELEGRAM_WEBHOOK_ALLOWED_UPDATES: "${MGKE_TELEGRAM_WEBHOOK_ALLOWED_UPDATES:-message,callback_query}"
    volumes:
      - bot-data:/data
    # The API stays on the host loopback only: Telegram never talks to it.
    ports:
      - "127.0.0.1:${MGKE_HTTP_PORT:-8081}:8081"
    stop_grace_period: 30s

  nginx:
    image: nginx:stable-alpine
    container_name: mgke-nginx
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      BOT_DOMAIN: "${BOT_DOMAIN:?set BOT_DOMAIN to the public domain of this host}"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx renders default.conf.template with envsubst on start.
      - ./deploy/nginx:/etc/nginx/templates:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    stop_grace_period: 10s

  certbot:
    image: certbot/certbot:latest
    container_name: mgke-certbot
    restart: unless-stopped
    depends_on:
      - nginx
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  bot-data:
    name: mgke-bot-data
  certbot-webroot:
    name: mgke-certbot-webroot
  letsencrypt:
    name: mgke-letsencrypt

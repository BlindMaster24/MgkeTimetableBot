services:
  bot:
    build: .
    image: mgke-timetable-bot:latest
    container_name: mgke-timetable-bot
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      MGKE_DB_PATH: /data/sqlite3.db
      MGKE_CHAT_DB_PATH: /data/bot_chats.db
      MGKE_CACHE_DIR: /data/cache/rasp
      MGKE_LOGGING_LEVEL: "${MGKE_LOGGING_LEVEL:-info}"
      MGKE_HTTP_PORT: "${MGKE_HTTP_PORT:-8081}"
      MGKE_TELEGRAM_TOKEN: "${MGKE_TELEGRAM_TOKEN:?set MGKE_TELEGRAM_TOKEN in .env or the environment}"
      MGKE_TELEGRAM_ADMIN_IDS: "${MGKE_TELEGRAM_ADMIN_IDS:-}"
      MGKE_PARSER_ENABLED: "${MGKE_PARSER_ENABLED:-true}"
      MGKE_CALENDAR_ICS_ENABLED: "${MGKE_CALENDAR_ICS_ENABLED:-false}"
    volumes:
      - bot-data:/data
      # - ./configs/config.yaml:/app/configs/config.yaml:ro
    ports:
      - "${MGKE_HTTP_PORT:-8081}:${MGKE_HTTP_PORT:-8081}"
    stop_grace_period: 30s

volumes:
  bot-data:

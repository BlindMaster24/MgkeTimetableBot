services:
  bot:
    build: .
    image: mgke-timetable-bot:latest
    container_name: mgke-timetable-bot
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      TZ: "${TZ:-Europe/Minsk}"
      MGKE_DB_PATH: /data/sqlite3.db
      MGKE_CHAT_DB_PATH: /data/bot_chats.db
      MGKE_CACHE_DIR: /data/cache/rasp
      MGKE_LOGGING_LEVEL: "${MGKE_LOGGING_LEVEL:-info}"
      MGKE_HTTP_PORT: "${MGKE_HTTP_PORT:-8081}"
      MGKE_TELEGRAM_TOKEN: "${MGKE_TELEGRAM_TOKEN:?set MGKE_TELEGRAM_TOKEN in .env or the environment}"
      MGKE_TELEGRAM_ADMIN_IDS: "${MGKE_TELEGRAM_ADMIN_IDS:-}"
      MGKE_PARSER_ENABLED: "${MGKE_PARSER_ENABLED:-true}"
      MGKE_PARSER_PROXY: "${MGKE_PARSER_PROXY:-}"
      MGKE_CALENDAR_ICS_ENABLED: "${MGKE_CALENDAR_ICS_ENABLED:-false}"
      MGKE_TELEGRAM_WEBHOOK_ENABLED: "${MGKE_TELEGRAM_WEBHOOK_ENABLED:-false}"
      MGKE_TELEGRAM_WEBHOOK_URL: "${MGKE_TELEGRAM_WEBHOOK_URL:-}"
      MGKE_TELEGRAM_WEBHOOK_LISTEN: "${MGKE_TELEGRAM_WEBHOOK_LISTEN:-127.0.0.1:8082}"
      MGKE_TELEGRAM_WEBHOOK_SECRET_TOKEN: "${MGKE_TELEGRAM_WEBHOOK_SECRET_TOKEN:-}"
      MGKE_TELEGRAM_WEBHOOK_MAX_CONNECTIONS: "${MGKE_TELEGRAM_WEBHOOK_MAX_CONNECTIONS:-40}"
    volumes:
      - bot-data:/data
      # - ./configs/config.yaml:/app/configs/config.yaml:ro
    ports:
      - "${MGKE_HTTP_PORT:-8081}:${MGKE_HTTP_PORT:-8081}"
      # For telegram.webhook mode set MGKE_TELEGRAM_WEBHOOK_LISTEN=0.0.0.0:8082 and publish:
      # - "${MGKE_TELEGRAM_WEBHOOK_PORT:-8082}:8082"
    stop_grace_period: 30s

volumes:
  bot-data:

name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lockfile:
        name: lockfile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Verify lockfile is up to date
              run: pnpm install --frozen-lockfile

    lint:
        name: lint
        needs: lockfile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ESLint
              run: pnpm run lint

            - name: Prettier
              run: pnpm run format:check

    build:
        name: build-and-test (node ${{ matrix.node }})
        needs: lockfile
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22']
                experimental: [false]
                include:
                    - node: '24'
                      experimental: true
                    - node: '25'
                      experimental: true
        continue-on-error: ${{ matrix.experimental }}
        steps:
            - uses: actions/checkout@v4

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node.js ${{ matrix.node }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Seed config.ts from example
              run: cp config.example.ts config.ts

            - name: Type check
              run: pnpm run ts-check

            - name: Run tests
              run: pnpm run test:all

    coverage:
        name: coverage
        needs: lockfile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Seed config.ts from example
              run: cp config.example.ts config.ts

            - name: Run tests with coverage
              run: pnpm run test:coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: coverage
                  retention-days: 14

    audit:
        name: audit
        needs: lockfile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Enable corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit (fails on any known vulnerability)
              run: pnpm audit --audit-level=low

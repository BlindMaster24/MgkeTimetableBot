name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: format, build and vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show the toolchain
        run: go version

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt wants to reformat:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Build every binary
        run: |
          out="$(mktemp -d)"
          go build -o "$out/" ./cmd/bot/
          go build -o "$out/" ./cmd/migrate-pg/
          go build -o "$out/" ./scripts/paritycheck/
          ls -l "$out"

      - name: Cross-compile the release targets
        if: runner.os == 'Linux'
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            echo "building ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/bot/
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/migrate-pg/
          done

  test:
    name: tests with coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 -p 1 -covermode=atomic -coverprofile=coverage.out ./internal/... ./tests/... ./cmd/...

      - name: Summarize coverage
        if: runner.os == 'Linux'
        run: |
          go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  newest-toolchain:
    name: newest Go toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: true

      - name: Show the toolchain
        run: go version

      - name: Test
        run: go test -count=1 -p 1 ./internal/... ./tests/... ./cmd/...

  race:
    name: tests under the race detector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with -race
        run: |
          if go run ./scripts/racecheck -check; then
            go run ./scripts/racecheck
          elif [ "${RUNNER_OS}" = "Windows" ]; then
            echo "::warning title=race detector unavailable::the runner has no usable C toolchain, skipping -race"
          else
            go run ./scripts/racecheck -check
            exit 1
          fi

  parity:
    name: TypeScript parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch the old TypeScript bot branch
        run: git fetch --depth=1 origin old

      - name: Compare the Go bot against the TypeScript bot
        run: go run ./scripts/paritycheck -ts-ref origin/old

      - name: Check keyboard layouts against the golden file
        run: go test -count=1 -run 'Golden|Parity' ./internal/telegram/

      - name: Check the docs against the bot surface
        run: go test -count=1 ./tests/

  container:
    name: container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute the build date
        id: builddate
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: mgke-timetable-bot:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the bot
        run: |
          docker run -d --name mgke-smoke \
            -e MGKE_TELEGRAM_TOKEN="123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" \
            -e MGKE_PARSER_ENABLED=false \
            -e MGKE_HTTP_PORT=8080 \
            -p 18081:8080 \
            mgke-timetable-bot:ci

      - name: Wait for the API to report healthy
        run: |
          code=""
          for _ in $(seq 1 60); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:18081/api/health || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done

          if [ "$code" != "200" ]; then
            echo "health never answered 200 (last status $code)" >&2
            cat /tmp/health.json >&2 || true
            exit 1
          fi

          jq -e '.build.version == "ci"' /tmp/health.json > /dev/null
          jq -e '.build.commit != "" and .build.commit != "unknown"' /tmp/health.json > /dev/null
          jq -e '.alerts == [] or .alerts == null' /tmp/health.json > /dev/null

      - name: Check the container can render schedule images
        run: |
          font="$(docker exec mgke-smoke find /usr/share/fonts -name 'DejaVuSans.ttf' -print -quit)"
          if [ -z "$font" ]; then
            echo "the image has no font, so the schedule PNG renderer cannot work" >&2
            exit 1
          fi
          echo "image font: $font"

      - name: Check the container runs in the configured timezone
        run: |
          zone="$(docker exec mgke-smoke date +%z)"
          if [ "$zone" != "+0300" ]; then
            echo "container timezone offset is $zone, expected +0300" >&2
            exit 1
          fi
          docker exec mgke-smoke test -f /usr/share/zoneinfo/Europe/Minsk

      - name: Check the API info endpoint
        run: |
          jq -e '.build.version == "ci"' <(curl -s http://127.0.0.1:18081/api/info) > /dev/null

      - name: Show the container logs
        if: failure()
        run: docker logs mgke-smoke

      - name: Stop the bot gracefully
        run: |
          docker stop --time 20 mgke-smoke > /dev/null
          logs="$(docker logs mgke-smoke 2>&1)"
          printf '%s\n' "$logs" | tail -20
          if ! grep -q "stop signal received" <<< "$logs"; then
            echo "the bot did not log the stop signal it received" >&2
            exit 1
          fi
          if ! grep -q "shutdown complete" <<< "$logs"; then
            echo "the bot did not finish its graceful shutdown on SIGTERM" >&2
            exit 1
          fi

      - name: Remove the container
        if: always()
        run: docker rm -f mgke-smoke || true

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
